# Builds the Docker image and runs the same verification path as `make verify`.
# Never publishes an image and never deploys.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lint, typecheck, unit tests (Docker)
        run: make test
      - name: Playwright E2E (Docker)
        run: make test-e2e
      - name: Stop stack
        if: always()
        run: make down
