# Local demo stack. Synthetic data only. Nothing here talks to a real provider.
name: flag-control-plane

x-env: &app-env
  DATABASE_URL: postgresql://flags:flags@db:5432/flags
  AUTH_SECRET: local-demo-secret-not-for-production
  # No AUTH_URL: with AUTH_TRUST_HOST, Auth.js uses the request host, so the
  # console works from localhost and the e2e container (http://app:3000) alike.
  AUTH_TRUST_HOST: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
      POSTGRES_DB: flags
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: dev
    environment: *app-env
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Lint, typecheck, and Vitest in a container. `docker compose run test`.
  test:
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment: *app-env
    command: sh -c "npm run lint && npm run typecheck && npm test"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Playwright E2E against the running app container.
  e2e:
    build:
      context: .
      target: e2e
    profiles: ["e2e"]
    environment:
      APP_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
